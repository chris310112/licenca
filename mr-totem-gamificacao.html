<style>

.login{max-width:440px;margin:40px auto}.preview-img{width:100%;max-height:170px;object-fit:contain;border:1px dashed var(--border);border-radius:10px;background:#fafafa}
.upload-preview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}.upload-preview-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
.toast{position:fixed;right:16px;bottom:16px;background:#111827;color:#fff;padding:12px 16px;border-radius:12px;z-index:100;opacity:0;pointer-events:none;transform:translateY(10px);transition:.2s}.toast.show{opacity:1;transform:none}
.empty{text-align:center;padding:26px;color:var(--muted)}.mini-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.mini-stat{padding:14px;border-radius:13px;background:var(--card);border:1px solid var(--border)}
.bar{display:grid;grid-template-columns:110px 1fr 40px;gap:8px;align-items:center;margin:6px 0;font-size:13px}.bar div{background:#e5e7eb;border-radius:99px;height:12px;overflow:hidden}.bar i{display:block;height:100%;background:var(--primary);border-radius:99px}.bar i.g{background:var(--success)}.bar i.r{background:var(--danger)}

</style>

<body>
<header><div class="brand"><img id="logo" class="hidden" alt=""><span id="brandName">MR. TOTEM</span></div><div class="header-right"><span id="headerStatus" class="status"></span><button class="icon-btn" onclick="toggleFS()" aria-label="Tela cheia">⛶</button></div></header>

<script>
'use strict';
const KEY='mrTotem_FINAL_2026',VER=4,$=id=>document.getElementById(id);
const GM={memory:{label:'Memory',icon:'🧠',t:60},quiz:{label:'Quiz',icon:'❓',t:30},roulette:{label:'Roleta',icon:'🎡',t:15},chest:{label:'Baú',icon:'🎁',t:20},pipes:{label:'Encanador',icon:'🔧',t:45},connect:{label:'Connect',icon:'🔴',t:60},blocks:{label:'Blocks',icon:'🧱',t:90},penalty:{label:'Pênalti',icon:'⚽',t:20},scratch:{label:'Raspadinha',icon:'🎟️',t:30}};
const TH={primary:'#111827',primary2:'#374151',background:'#f4f5f7',card:'#ffffff',text:'#111827',accent:'#eef2ff'};
const EMO=['🍎','🚀','⭐','🎯','🎈','🔥','🍀','💎','🎵','🐱','🌈','⚽','🍕','🎁','👑','🌻','🐳','🎲','🍩','🦄'];
const clone=x=>JSON.parse(JSON.stringify(x));
const uid=p=>p+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const esc=v=>String(v??'').replace(/[&<>'"`]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;','`':'&#96;'}[c]));
const isObj=v=>v&&typeof v==='object'&&!Array.isArray(v);
function merge(b,v){const o=clone(b);if(!isObj(v))return o;for(const k in v)o[k]=(isObj(v[k])&&isObj(o[k]))?merge(o[k],v[k]):v[k];return o}
const DC={id:'campanha_1',name:'Campanha Principal',active:true,startDate:'',endDate:'',fields:{name:true,whatsapp:true,email:true,cpf:false},games:Object.keys(GM),gameTimes:{memory:60,quiz:30,roulette:15,chest:20,pipes:45,connect:60,blocks:90,penalty:20,scratch:30},inactivityTime:0,lossMessage:'Tempo esgotado! Você perdeu.',image:'',logo:'',brandName:'MR. TOTEM',showBrandName:true,imageFit:'contain',imageShape:'wide',imageHeight:260,theme:TH,autoReturn:{enabled:false,seconds:8},fullscreenDefault:false,showCampaignImage:true,maxPlaysPerParticipant:0};
const mkPrize=(id,name,n)=>({id,name,description:'',total:n,remaining:n,delivered:0,active:true,games:[],weight:1});
const DD={version:VER,license:null,maxSeen:0,installId:'',totem:{name:'Totem 1',games:null,loop:true,loopSec:6},media:{mode:'both',idle:20,items:[]},settings:{adminPassword:'1234',defaultGameTimes:{memory:60,quiz:30,roulette:15,chest:20,pipes:45,connect:60,blocks:90,penalty:20,scratch:30}},campaigns:[DC],participants:[],winners:[],history:[],
prizes:[mkPrize('p1','Desconto especial',10),mkPrize('p2','Brinde',5),mkPrize('p3','Experiência exclusiva',2)],
pipes:{size:5},connect:{level:1},blocks:{goal:5,speed:700},penalty:{winChance:70,boardImage:''},scratch:{winChance:35,symbols:[],cover:''},memory:{title:'Memory',pairs:4,images:[]},
quiz:{title:'Quiz Mr. Totem',minCorrect:1,questions:[{question:'Qual produto é o destaque da Mr. Totem?',options:['Totem digital','Bicicleta','Televisão antiga','Câmera'],correct:0}]},

/* ---------- migração / normalização (preserva dados antigos) ---------- */
function normC(c,i){const x=merge(DC,c||{});x.id=x.id||uid('camp');x.name=x.name||'Campanha '+(i+1);x.fields=merge(DC.fields,x.fields);x.theme=merge(TH,x.theme);x.autoReturn=merge(DC.autoReturn,x.autoReturn);x.gameTimes=merge(DC.gameTimes,x.gameTimes);x.games=(Array.isArray(x.games)?x.games:Object.keys(GM)).filter(g=>GM[g]);x.inactivityTime=Math.max(0,+x.inactivityTime||0);x.maxPlaysPerParticipant=Math.max(0,+x.maxPlaysPerParticipant||0);return x}
function norm(raw){const x=merge(DD,raw||{});x.version=VER;x.settings=merge(DD.settings,x.settings);x.settings.defaultGameTimes=merge(DD.settings.defaultGameTimes,x.settings.defaultGameTimes);
x.campaigns=(Array.isArray(x.campaigns)?x.campaigns:[]).map(normC);if(!x.campaigns.length)x.campaigns=[normC(DC,0)];
let seen=false;x.campaigns.forEach(c=>{if(c.active&&!seen)seen=true;else c.active=false});if(!seen)x.campaigns[0].active=true;
['participants','winners','history','prizes'].forEach(k=>{if(!Array.isArray(x[k]))x[k]=[]});
x.prizes=x.prizes.map(p=>{const q=merge({id:uid('p'),name:'Prêmio',description:'',total:0,remaining:0,delivered:0,active:true,games:[],weight:1},p);q.remaining=Math.max(0,+q.remaining||0);q.delivered=Math.max(0,+q.delivered||0);q.total=Math.max(+q.total||0,q.remaining+q.delivered);q.weight=Math.max(1,+q.weight||1);q.games=Array.isArray(q.games)?q.games.filter(g=>GM[g]):[];return q});
x.memory.pairs=Math.min(20,Math.max(1,+x.memory.pairs||4));x.memory.images=Array.isArray(x.memory.images)?x.memory.images:[];
x.pipes.size=Math.min(7,Math.max(3,+x.pipes.size||5));x.connect.level=[1,2,3].includes(+x.connect.level)?+x.connect.level:1;x.blocks.goal=Math.min(15,Math.max(1,+x.blocks.goal||5));x.blocks.speed=Math.min(2000,Math.max(200,+x.blocks.speed||700));x.penalty.winChance=Math.min(100,Math.max(10,+x.penalty.winChance||70));x.penalty.boardImage=typeof x.penalty.boardImage==='string'?x.penalty.boardImage:'';x.scratch.winChance=Math.min(100,Math.max(5,+x.scratch.winChance||35));x.scratch.symbols=Array.isArray(x.scratch.symbols)?x.scratch.symbols.filter(v=>typeof v==='string').slice(0,5):[];x.scratch.cover=typeof x.scratch.cover==='string'?x.scratch.cover:'';[['memory','back'],['roulette','image'],['chest','image'],['pipes','bg'],['pipes','end'],['blocks','bg'],['penalty','bigImage']].forEach(([a,b])=>{if(typeof x[a][b]!=='string')x[a][b]=''});x.connect.images=Array.isArray(x.connect.images)?x.connect.images.filter(v=>typeof v==='string').slice(0,5):[];x.installId=x.installId||uid('T').slice(2).toUpperCase();if(!Array.isArray(x.media.items))x.media.items=[];if(x.totem.games&&!Array.isArray(x.totem.games))x.totem.games=null;if(!Array.isArray(x.quiz.questions)||!x.quiz.questions.length)x.quiz.questions=clone(DD.quiz.questions);
x.quiz.questions=x.quiz.questions.map(q=>({question:String(q.question||'Pergunta'),options:(Array.isArray(q.options)?q.options:[]).concat(['','','','']).slice(0,4).map((o,i)=>o||'Opção '+(i+1)),correct:Math.min(3,Math.max(0,+q.correct||0)),image:typeof q.image==='string'?q.image:''}));
x.quiz.minCorrect=Math.min(x.quiz.questions.length,Math.max(1,+x.quiz.minCorrect||1));
['roulette','chest'].forEach(k=>{x[k].options=(Array.isArray(x[k].options)?x[k].options:[]).map(s=>String(s).trim()).filter(Boolean);if(k==='roulette'&&x[k].options.length<2)x[k].options=clone(DD.roulette.options);if(!x[k].options.length)x[k].options=clone(DD[k].options)});
return x}
function load(){try{let r=localStorage.getItem(KEY);if(!r){const k=Object.keys(localStorage).find(k=>/^mrTotem/i.test(k)&&k!==KEY);if(k)r=localStorage.getItem(k)}return norm(r?JSON.parse(r):null)}catch(e){return norm(null)}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){toast('Não foi possível salvar. O armazenamento pode estar cheio.');return false}}
let db=load();
/* ---------- utilidades ---------- */
function toast(m){const e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),3000)}
const activeC=()=>db.campaigns.find(c=>c.active)||db.campaigns[0],getC=id=>db.campaigns.find(c=>c.id===id)||null,getP=id=>db.participants.find(p=>p.id===id)||null,cFor=pid=>{const p=getP(pid);return(p&&getC(p.campaignId))||activeC()};
const fmt=v=>{try{return new Date(v).toLocaleString('pt-BR')}catch(e){return''}},gl=g=>GM[g]?.label||g||'';
const isLoss=s=>/^!|tente novamente|boa sorte|n[aã]o ganhou|quase/i.test(String(s)),lbl=s=>String(s).replace(/^!\s*/,'');

let P={};
const DX=[0,1,0,-1],DY=[-1,0,1,0],rotc=c=>({t:c.t,rot:(c.deg/90)%4}),pcon=c=>c.t==='I'?(c.rot%2?[0,2]:[1,3]):[c.rot,(c.rot+1)%4];
function genPipes(N){const s=Math.floor(Math.random()*N),e=Math.floor(Math.random()*N),seen=new Set(),path=[];
const dfs=(x,y)=>{seen.add(x+','+y);path.push([x,y]);if(x===N-1&&y===e)return true;const ds=[0,1,2,3].sort(()=>Math.random()-.5);if(Math.random()<.7){ds.splice(ds.indexOf(1),1);ds.unshift(1)}
for(const d of ds){const nx=x+DX[d],ny=y+DY[d];if(nx<0||ny<0||nx>=N||ny>=N||seen.has(nx+','+ny))continue;if(dfs(nx,ny))return true}path.pop();return false};
dfs(0,s);const to=(x,y,[qx,qy])=>DX.findIndex((_,d)=>x+DX[d]===qx&&y+DY[d]===qy);
const cells=Array.from({length:N*N},()=>({t:Math.random()<.5?'I':'L',deg:Math.floor(Math.random()*4)*90})),sol={};
path.forEach(([x,y],i)=>{const a=i?to(x,y,path[i-1]):3,b=i<path.length-1?to(x,y,path[i+1]):1,c=cells[y*N+x];
if((a+2)%4===b){c.t='I';sol[y*N+x]=a%2?0:1}else{c.t='L';let k=0;while(!([k,(k+1)%4].includes(a)&&[k,(k+1)%4].includes(b)))k++;sol[y*N+x]=k}c.deg=Math.floor(Math.random()*4)*90});
return{N,s,e,cells,sol,done:false}}
function pipeWet(){const{N,s,cells}=P,w=new Set(),st=[];if(pcon(rotc(cells[s*N])).includes(3)){w.add(s*N);st.push([0,s])}
while(st.length){const[x,y]=st.pop();for(const d of pcon(rotc(cells[y*N+x]))){const nx=x+DX[d],ny=y+DY[d];if(nx<0||ny<0||nx>=N||ny>=N)continue;const j=ny*N+nx;if(!w.has(j)&&pcon(rotc(cells[j])).includes((d+2)%4)){w.add(j);st.push([nx,ny])}}}return w}
const pipeWin=(w=pipeWet())=>{const{N,e,cells}=P,j=e*N+N-1;return w.has(j)&&pcon(rotc(cells[j])).includes(1)};
function paintPipes(){const w=pipeWet();P.cells.forEach((c,i)=>{const el=$('pc'+i);if(!el)return;el.firstChild.style.transform='rotate('+c.deg+'deg)';el.classList.toggle('wet',w.has(i))});return w}
function startPipes(){const N=Math.min(7,Math.max(3,+db.pipes.size||5));do{P=genPipes(N)}while(pipeWin());
let h='';for(let y=0;y<N;y++){h+=`<div class="pmark">${y===P.s?'💧':''}</div>`;for(let x=0;x<N;x++){const i=y*N+x,c=P.cells[i];h+=`<button class="pcell" id="pc${i}" onclick="tapPipe(${i})"><svg viewBox="0 0 100 100" style="transform:rotate(${c.deg}deg)"><path d="${c.t==='I'?'M0 50H100':'M50 0V50H100'}"/></svg></button>`}h+=`<div class="pmark">${y===P.e?(db.pipes.end?`<img src="${esc(db.pipes.end)}" alt="">`:'🚰'):''}</div>`}
$('gamePage').innerHTML=`<div class="panel game-area">${gameHead('🔧 Encanador')}<p>Toque nos canos para girar e leve a água até a saída.</p><div class="pipes${db.pipes.bg?' hasbg':''}" style="grid-template-columns:repeat(${N+2},1fr)${db.pipes.bg?`;background-image:linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,.6)),url('${db.pipes.bg}');background-size:cover;background-position:center`:''}">${h}</div>${giveUp}</div>`;show('gamePage');paintPipes();sync()}

function domColor(src,cb){const im=new Image();im.onload=()=>{try{const c=document.createElement('canvas');c.width=c.height=32;const x=c.getContext('2d');x.drawImage(im,0,0,32,32);const d=x.getImageData(0,0,32,32).data;let r=0,g=0,b=0,w=0;for(let i=0;i<d.length;i+=4){if(d[i+3]<128)continue;const mx=Math.max(d[i],d[i+1],d[i+2]),mn=Math.min(d[i],d[i+1],d[i+2]),sat=(mx-mn)/255,lum=(d[i]*.3+d[i+1]*.59+d[i+2]*.11)/255;if(lum>.93||lum<.07)continue;const wt=.2+sat*sat*6;r+=d[i]*wt;g+=d[i+1]*wt;b+=d[i+2]*wt;w+=wt}if(!w)return;r/=w;g/=w;b/=w;const L=(r*.3+g*.59+b*.11)/255;if(L>.8){r*=.7;g*=.7;b*=.7}else if(L<.25){r=r*.6+100;g=g*.6+100;b=b*.6+100}cb('#'+[r,g,b].map(v=>Math.round(Math.min(255,Math.max(0,v))).toString(16).padStart(2,'0')).join(''))}catch(e){}};im.src=src}
function genConnect(N,K){for(let t=0;t<300;t++){const occ=new Set(),pairs=[];let ok=true;
for(let k=0;k<K&&ok;k++){const free=[];for(let i=0;i<N*N;i++)if(!occ.has(i))free.push(i);let got=false;

per:()=>`<div class="form-grid"><div class="field"><label>Início da campanha</label><input id="cStart" type="datetime-local" value="${esc(c.startDate)}"></div><div class="field"><label>Fim da campanha</label><input id="cEnd" type="datetime-local" value="${esc(c.endDate)}"></div></div><p class="muted">Deixe em branco para a campanha não ter data de início ou de fim.</p>`,

function renderCamp(){const c=EW,nw=campNew();let h;
if(!CSEC){h=`<div class="actions" style="margin:0 0 12px"><button class="btn outline" onclick="goAdmin('campaigns')">← Voltar às campanhas</button></div><div class="panel"><h2>${esc(c.name)}</h2><p class="muted">${nw?'Campanha nova: ela só é criada quando você salvar uma das seções.':'Toque em uma seção para editar.'}</p><div class="sgrid">${CSECS.map(([k,i,l])=>`<button class="scard" onclick="openSec('${k}')"><span class="ic">${i}</span><b>${l}</b><small class="muted">${csum(k,c)}</small></button>`).join('')}</div></div>`}
else{const[,i,l]=CSECS.find(x=>x[0]===CSEC);h=`<div class="panel"><div class="section-title"><h2 style="margin:0">${i} ${l}</h2><button class="btn small outline" onclick="openSec(null)">← Seções</button></div><p class="muted" style="margin-top:4px">${esc(c.name)}</p>${campSec(CSEC,c)}<div class="actions"><button class="btn primary" onclick="saveCampSec()">Salvar</button><button class="btn outline" onclick="openSec(null)">Cancelar</button></div></div>`}
$('adminPage').innerHTML=h;scrollTo(0,0)}
function openSec(k){CSEC=k;renderCamp()}
function newCamp(){EW=normC({id:uid('camp'),name:'Nova campanha',active:false},db.campaigns.length);CSEC=null;renderCamp()}
function editCamp(id){const c=getC(id);if(!c)return;EW=clone(c);CSEC=null;renderCamp()}
function prevImg(e,id){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{$(id).src=r.result;$(id).classList.remove('hidden')};r.readAsDataURL(f)}
function compress(file,max=1280,q=.82,alpha=false){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*s)),h=Math.max(1,Math.round(im.height*s)),cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d');if(!alpha){x.fillStyle='#fff';x.fillRect(0,0,w,h)}x.drawImage(im,0,0,w,h);ok(alpha?cv.toDataURL('image/png'):cv.toDataURL('image/jpeg',q))};im.src=r.result};r.readAsDataURL(file)})}
async function saveCampSec(){const c=EW,k=CSEC;if(!c||!k)return;const gv=id=>$(id).value,gc=id=>$(id).checked;
if(k==='ident'){c.name=gv('cName').trim()||'Campanha';c.brandName=gv('cBrand').trim()||'MR. TOTEM';c.showBrandName=gv('cBrandShow')==='1'}
if(k==='img'){c.imageFit=gv('cFit');c.imageShape=gv('cShape');c.showCampaignImage=gv('cShow')==='1'}
if(k==='cores'){c.theme={};Object.keys(TH).forEach(x=>c.theme[x]=gv('th_'+x))}
if(k==='cad'){c.fields={};['name','whatsapp','email','cpf'].forEach(x=>c.fields[x]=gc('f_'+x))}
if(k==='jogos'){c.games=Object.keys(GM).filter(g=>gc('g_'+g));c.gameTimes={};Object.keys(GM).forEach(g=>c.gameTimes[g]=Math.max(1,+gv('t_'+g)||GM[g].t))}
if(k==='func'){c.inactivityTime=Math.max(0,+gv('cIdle')||0);c.maxPlaysPerParticipant=Math.max(0,+gv('cMax')||0);c.autoReturn={enabled:gv('cAuto')==='1',seconds:Math.max(1,+gv('cAutoS')||8)};c.fullscreenDefault=gv('cFull')==='1'}
if(k==='per'){const a=gv('cStart'),b=gv('cEnd');if(a&&b&&new Date(b)<=new Date(a))return toast('O fim precisa ser depois do início.');c.startDate=a;c.endDate=b}
if(k==='msg')c.lossMessage=gv('cLoss').trim()||DC.lossMessage;
try{if(k==='ident'){const f=$('cLogo').files[0];if($('cClrLogo').checked)c.logo='';if(f)c.logo=await compress(f,400,.85,true)}
if(k==='img'){const f=$('cImg').files[0];if($('cClrImg').checked)c.image='';if(f)c.image=await compress(f,1280,.82)}}catch(e){return toast('Não foi possível processar a imagem.')}
const out=clone(c),i=db.campaigns.findIndex(x=>x.id===out.id);
if(i<0){db.campaigns.push(out);if(db.campaigns.length===1)out.active=true}else{out.active=db.campaigns[i].active;db.campaigns[i]=out}
save();EW=clone(out);CSEC=null;toast('Salvo.');renderCamp()}
function activateCamp(id){db.campaigns.forEach(c=>c.active=c.id===id);save();goAdmin('campaigns')}
function delCamp(id){if(db.campaigns.length<=1)return toast('Mantenha ao menos uma campanha.');const c=getC(id);if(!c||!confirm(`Excluir a campanha "${c.name}"? Participantes antigos serão preservados.`))return;const was=c.active;db.campaigns=db.campaigns.filter(x=>x.id!==id);if(was)db.campaigns[0].active=true;save();goAdmin('campaigns')}
const tbl=(h,rows)=>`<div class="table-wrap"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${h.length}">Nada por aqui ainda.</td></tr>`}</tbody></table></div>`;
function aParts(){return`<div class="panel"><div class="section-title"><h2>Participantes</h2><span class="badge">${db.participants.length}</span></div>${tbl(['Nome','WhatsApp','E-mail','CPF','Campanha','Data'],db.participants.slice().reverse().map(p=>[p.name,p.whatsapp,p.email,p.cpf,p.campaignName||getC(p.campaignId)?.name||'',fmt(p.createdAt)]))}</div>`}
function aWins(){return`<div class="panel"><div class="section-title"><h2>Vencedores</h2><span class="badge green">${db.winners.length}</span></div>${tbl(['Participante','Campanha','Jogo','Resultado','Prêmio','Data'],db.winners.slice().reverse().map(w=>[w.participantName,w.campaignName,gl(w.game),w.result,w.prize,fmt(w.createdAt)]))}</div>`}

let pendImgs=[];
const imgField=(id,label,cur,hint)=>`<div class="field imgf"><label>${label}</label><input id="${id}" type="file" accept="image/*" onchange="prevImg(event,'${id}P')"><label style="display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;margin:6px 0;width:auto"><input type="checkbox" id="${id}X" style="width:auto;margin:0"> Remover imagem</label><img id="${id}P" class="preview-img ${cur?'':'hidden'}" src="${esc(cur||'')}" alt="" style="max-height:110px">${hint?`<span class="muted">${hint}</span>`:''}</div>`;
async function readImg(id,cur,max,q,alpha){let v=cur||'';const x=$(id+'X');if(x&&x.checked)v='';const f=$(id)&&$(id).files[0];if(f)v=await compress(f,max,q,alpha||/png|webp|gif/.test(f.type));return v}
let GSEL=null;
const gInfo={memory:()=>db.memory.pairs+' pares',quiz:()=>db.quiz.questions.length+(db.quiz.questions.length===1?' pergunta':' perguntas')+', mín. '+db.quiz.minCorrect+(db.quiz.minCorrect===1?' acerto':' acertos'),roulette:()=>db.roulette.options.length+' setores',chest:()=>db.chest.options.length+' resultados',pipes:()=>'Grade '+db.pipes.size+'×'+db.pipes.size,connect:()=>({1:'Fácil',2:'Médio',3:'Difícil'}[db.connect.level]||'Fácil'),blocks:()=>'Meta de '+db.blocks.goal+' linhas',penalty:()=>'Chance de gol '+db.penalty.winChance+'%',scratch:()=>'Chance de prêmio '+db.scratch.winChance+'%'};

function gamePanel(g){const q=db.quiz;const P={
memory:()=>`<div class="panel"><h2>🧠 Memory</h2><div class="grid-2"><div class="field"><label>Título</label><input id="memTitle" value="${esc(db.memory.title)}"></div><div class="field"><label>Pares (1 a 20)</label><input id="memPairs" type="number" min="1" max="20" value="${db.memory.pairs}"></div></div><div class="field" style="margin-top:12px"><label>Imagens dos pares (opcional, senão usa emojis)</label><input type="file" accept="image/*" multiple onchange="prevMem(event)"></div><div id="memPrev" class="upload-preview-grid" style="margin-top:10px"></div>${imgField('memBack','Imagem do verso das cartas (opcional)',db.memory.back,'Aparece em todas as cartas viradas para baixo. Use algo quadrado, como a logo.')}<div class="actions"><button class="btn primary" onclick="saveMem()">Salvar Memory</button></div></div>`,
quiz:()=>`<div class="panel"><h2>❓ Quiz</h2><div class="grid-2"><div class="field"><label>Título</label><input id="quizTitle" value="${esc(q.title)}"></div><div class="field"><label>Acertos mínimos para ganhar</label><input id="quizMin" type="number" min="1" value="${q.minCorrect}"></div></div><div id="quizEd"></div><div class="actions"><button class="btn" onclick="addQ()">+ Questão</button><button class="btn primary" onclick="saveQuiz()">Salvar Quiz</button></div></div>`,
roulette:()=>`<div class="panel"><h2>🎡 Roleta</h2><div class="field"><label>Setores, um por linha (comece com ! para marcar como derrota)</label><textarea id="roulOpts">${esc(db.roulette.options.join('\n'))}</textarea></div><p class="muted">Mínimo de 2 setores. "Tente novamente" e "Boa sorte" também contam como derrota.</p>${imgField('rlImg','Imagem no centro da roleta (opcional)',db.roulette.image,'Fica no miolo da roleta. Funciona melhor com logo redonda ou PNG transparente.')}<button class="btn primary" onclick="saveList('roulette','roulOpts','rlImg')">Salvar Roleta</button></div>`,

pipes:()=>`<div class="panel"><h2>🔧 Encanador</h2><div class="field"><label>Tamanho da grade</label><select id="pipSize">${[4,5,6,7].map(n=>`<option value="${n}" ${db.pipes.size===n?'selected':''}>${n}×${n}</option>`).join('')}</select></div><div class="form-grid" style="margin-top:12px">${imgField('pipBg','Imagem de fundo do tabuleiro (opcional)',db.pipes.bg)}${imgField('pipEnd','Imagem na saída da água (opcional, no lugar da torneira)',db.pipes.end)}</div><button class="btn primary" style="margin-top:12px" onclick="savePipes()">Salvar Encanador</button></div>`,
connect:()=>`<div class="panel"><h2>🔴 Connect</h2><div class="field"><label>Dificuldade</label><select id="cnLevel"><option value="1" ${db.connect.level===1?'selected':''}>Fácil (5×5, 3 pares)</option><option value="2" ${db.connect.level===2?'selected':''}>Médio (6×6, 4 pares)</option><option value="3" ${db.connect.level===3?'selected':''}>Difícil (7×7, 5 pares)</option></select></div><div class="field" style="margin-top:12px"><label>Imagens das bolinhas (até 5, opcional)</label><input id="cnImgs" type="file" accept="image/*" multiple><label style="display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;margin:6px 0;width:auto"><input type="checkbox" id="cnImgsX" style="width:auto;margin:0"> Remover imagens</label>${db.connect.images.length?`<div class="upload-preview-grid">${db.connect.images.map(v=>`<img src="${esc(v)}" alt="">`).join('')}</div>`:''}<span class="muted">A linha de cada par usa a cor principal da imagem. Entram 3 pares no fácil, 4 no médio e 5 no difícil; sem imagem, as bolinhas ficam coloridas.</span></div><button class="btn primary" style="margin-top:12px" onclick="saveConnect()">Salvar Connect</button></div>`,
blocks:()=>`<div class="panel"><h2>🧱 Blocks</h2><div class="form-grid"><div class="field"><label>Linhas para ganhar</label><input id="blGoal" type="number" min="1" max="15" value="${db.blocks.goal}"></div><div class="field"><label>Velocidade</label><select id="blSpeed"><option value="900" ${db.blocks.speed===900?'selected':''}>Lenta</option><option value="700" ${db.blocks.speed===700?'selected':''}>Normal</option><option value="450" ${db.blocks.speed===450?'selected':''}>Rápida</option></select></div></div>${imgField('blBg','Imagem de fundo do tabuleiro (opcional)',db.blocks.bg,'Aparece atrás das peças.')}<button class="btn primary" style="margin-top:12px" onclick="saveBlocks()">Salvar Blocks</button></div>`,
penalty:()=>`<div class="panel"><h2>⚽ Pênalti</h2><div class="form-grid"><div class="field"><label>Chance máxima de gol quando a pessoa acerta o alvo (%)</label><input id="penChance" type="number" min="10" max="100" value="${db.penalty.winChance}"></div><div class="field"><label>Imagem das placas do estádio (opcional)</label><input id="penImg" type="file" accept="image/*"><label class="check-row"><input type="checkbox" id="penClr"> Remover imagem</label></div></div><p class="muted">Sem imagem própria, as placas usam a logo da campanha, ou o nome do topo se não houver logo. O goleiro pula para um lado sorteado e a mira conta: cantos têm mais chance de gol e o centro, menos.</p>${db.penalty.boardImage?`<img class="preview-img" src="${esc(db.penalty.boardImage)}" alt="">`:''}${imgField('penBig','Imagem grande: telão do estádio e logo no gramado (opcional)',db.penalty.bigImage,'Sem imagem própria, usa a logo da campanha.')}<div class="actions"><button class="btn primary" onclick="savePenalty()">Salvar Pênalti</button></div></div>`,
scratch:()=>`<div class="panel"><h2>🎟️ Raspadinha</h2><div class="form-grid"><div class="field"><label>Chance de ganhar (%)</label><input id="scChance" type="number" min="5" max="100" value="${db.scratch.winChance}"></div><div class="field"><label>Imagem da capa (opcional)</label><input id="scCov" type="file" accept="image/*"><label class="check-row"><input type="checkbox" id="scClrCov"> Remover capa</label></div><div class="field full"><label>Imagens dos símbolos (até 5, opcional; sem imagens usa emojis)</label><input id="scSym" type="file" accept="image/*" multiple><label class="check-row"><input type="checkbox" id="scClrSym"> Remover imagens dos símbolos</label></div></div>${db.scratch.symbols.length?`<div class="upload-preview-grid" style="margin-top:10px">${db.scratch.symbols.map(v=>`<img src="${esc(v)}" alt="">`).join('')}</div>`:''}<p class="muted">Ganha quem encontrar 3 símbolos iguais. O sorteio é feito antes de a pessoa raspar, respeitando a chance acima, e a pessoa revela o resultado raspando mais da metade do cartão. Sem capa própria, a capa é prateada com a logo da campanha.</p><div class="actions"><button class="btn primary" onclick="saveScratch()">Salvar Raspadinha</button></div></div>`
};return P[g]?P[g]():''}
function aGames(){if(GSEL&&GM[GSEL]){pendImgs=clone(db.memory.images||[]);return`<div class="actions" style="margin:0 0 12px"><button class="btn outline" onclick="selGame(null)">← Voltar aos jogos</button></div>`+gamePanel(GSEL)}
const a=activeC();return`<div class="panel"><h2>🎮 Jogos</h2><p class="muted">Toque em um jogo para ver e editar as configurações dele.</p><div class="sgrid">${Object.keys(GM).map(g=>{const on=a.games.includes(g);return`<button class="scard ${on?'on':''}" onclick="selGame('${g}')"><span class="ic">${GM[g].icon}</span><b>${GM[g].label}</b><small class="muted">${esc(gInfo[g]?gInfo[g]():'')}</small><span class="badge ${lk(g)?'gray':'green'}">${lk(g)?'🔒 Fora da licença':'Liberado'}</span><span class="badge ${on?'':'gray'}">${on?'Na campanha ativa':'Fora da campanha ativa'}</span></button>`}).join('')}</div></div>`}
function prevMem(e){const f=[...(e.target.files||[])];if(!f.length)return;Promise.all(f.map(x=>compress(x,700,.78))).then(a=>{pendImgs=a.slice(0,20);renderMemPrev()}).catch(()=>toast('Erro ao carregar imagens.'))}
function renderMemPrev(){const e=$('memPrev');if(e)e.innerHTML=pendImgs.map((s,i)=>`<div><img src="${esc(s)}" alt=""><button class="btn small danger" onclick="pendImgs.splice(${i},1);renderMemPrev()">Remover</button></div>`).join('')||'<span class="muted">Sem imagens: serão usados emojis.</span>'}
async function saveMem(){try{db.memory.back=await readImg('memBack',db.memory.back,400,.8,false)}catch(e){return toast('Não foi possível processar a imagem.')}db.memory.title=$('memTitle').value.trim()||'Memory';db.memory.pairs=Math.min(20,Math.max(1,+$('memPairs').value||4));db.memory.images=pendImgs.slice(0,db.memory.pairs);save();toast('Memory salvo.');goAdmin('games')}
function renderQuizAdm(){const e=$('quizEd');if(!e)return;e.innerHTML=db.quiz.questions.map((q,i)=>`<div class="card" style="margin:10px 0"><div class="field"><label>Questão ${i+1}</label><input data-q="${i}" value="${esc(q.question)}"></div><div class="grid-2" style="margin-top:8px">${q.options.map((o,j)=>`<div class="field"><label>Opção ${j+1}</label><input data-o="${i}-${j}" value="${esc(o)}"></div>`).join('')}</div><div class="field" style="margin-top:8px"><label>Resposta correta (1-4)</label><input data-c="${i}" type="number" min="1" max="4" value="${q.correct+1}"></div><div class="field" style="margin-top:8px"><label>Imagem da pergunta (opcional)</label><input type="file" accept="image/*" onchange="qImg(${i},event)">${q.image?`<img class="preview-img" src="${esc(q.image)}" alt="" style="max-height:110px"><button class="btn small outline" onclick="qImgDel(${i})">Remover imagem</button>`:''}</div><button class="btn small danger" style="margin-top:8px" onclick="delQ(${i})">Remover pergunta</button></div>`).join('')}
function readQuiz(){db.quiz.questions.forEach((q,i)=>{q.question=document.querySelector(`[data-q="${i}"]`).value.trim()||'Pergunta';q.options=q.options.map((_,j)=>document.querySelector(`[data-o="${i}-${j}"]`).value.trim()||'Opção '+(j+1));q.correct=Math.min(3,Math.max(0,(+document.querySelector(`[data-c="${i}"]`).value||1)-1))})}
function addQ(){readQuiz();db.quiz.questions.push({question:'Nova pergunta',options:['Opção 1','Opção 2','Opção 3','Opção 4'],correct:0,image:''});renderQuizAdm()}
async function qImg(i,e){const f=e.target.files[0];if(!f)return;readQuiz();try{db.quiz.questions[i].image=await compress(f,640,.78,/png|webp|gif/.test(f.type))}catch(x){return toast('Não foi possível processar a imagem.')}renderQuizAdm()}
function qImgDel(i){readQuiz();db.quiz.questions[i].image='';renderQuizAdm()}
function delQ(i){if(db.quiz.questions.length<=1)return toast('Mantenha ao menos uma questão.');readQuiz();db.quiz.questions.splice(i,1);renderQuizAdm()}
function saveQuiz(){readQuiz();db.quiz.title=$('quizTitle').value.trim()||'Quiz Mr. Totem';db.quiz.minCorrect=Math.min(db.quiz.questions.length,Math.max(1,+$('quizMin').value||1));save();toast('Quiz salvo.');goAdmin('games')}
async function saveList(k,id,img){const o=$(id).value.split(/\n/).map(x=>x.trim()).filter(Boolean);if(k==='roulette'&&o.length<2)return toast('A roleta precisa de ao menos 2 setores.');if(!o.length)return toast('Informe ao menos uma opção.');db[k].options=o;if(img){try{db[k].image=await readImg(img,db[k].image,k==='chest'?360:300,.85,true)}catch(e){return toast('Não foi possível processar a imagem.')}}save();toast('Salvo.');goAdmin('games')}

function restore(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result),d=j.data||j;if(!isObj(d)||!Array.isArray(d.campaigns))throw 0;if(!confirm('Restaurar este backup? Os dados atuais serão substituídos.'))return;d.installId=db.installId;d.license=db.license;d.maxSeen=db.maxSeen;db=norm(d);save();toast('Backup restaurado.');setTimeout(openAdmin,300)}catch(x){toast('Backup inválido ou corrompido.')}};r.readAsText(f)}

/* ---------- licença: assinatura ECDSA (a chave privada fica só no gerador) ---------- */
const PUB={"kty":"EC","crv":"P-256","x":"fUvfXkvRxCwJzmxR9RS2Dj5xoLrgIoTGPhoOCzfZX84","y":"M8MTPYRg3AYzsw5mwL1ePye_6L6JIN_KeP9SUrRyzRk"};
const unb=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
async function verifyLic(s){try{const[p,pl,sg]=String(s).trim().split('.');if(p!=='MT1')return null;const k=await crypto.subtle.importKey('jwk',PUB,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);return await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},k,unb(sg),unb(pl))?JSON.parse(new TextDecoder().decode(unb(pl))):null}catch(e){return null}}
let LIC={st:'none',days:0,gr:5,info:null};
const licBlock=()=>LIC.st==='none'||LIC.st==='blocked';
async function checkLic(){db.maxSeen=Math.max(db.maxSeen||0,Date.now());const i=db.license&&await verifyLic(db.license.serial);
if(!i||i.d!==db.installId){LIC={st:'none',days:0,gr:5,info:null};return}
if(i.u){try{const r=await fetch(i.u+(i.u.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'});const j=await r.json();db.license.revoked=(j.revoked||[]).includes(i.i)}catch(e){}}
const days=Math.floor((new Date(i.e+'T23:59:59')-db.maxSeen)/864e5),gr=i.g??5;
LIC={info:i,days,gr,st:db.license.revoked?'blocked':days>=0?(days<=7?'warn':'ok'):days>=-gr?'overdue':'blocked'};save()}
function licBanner(){const{st,days,gr}=LIC,b=(c,t)=>`<div class="panel" style="border-color:${c};background:${c==='#f59e0b'?'#fffbeb':'#fef2f2'}">${t}</div>`;
if(st==='warn')return b('#f59e0b',`<b>⚠️ Sua licença vence ${days<1?'hoje':'em '+days+' dia(s)'}.</b> Renove a mensalidade para evitar o desligamento.`);
if(st==='overdue')return b('#dc2626',`<b>⛔ Mensalidade vencida.</b> O software será desligado em ${Math.max(1,gr+days+1)} dia(s) se o pagamento não for regularizado.`);
if(st==='blocked')return b('#dc2626','<b>⛔ Licença suspensa ou expirada.</b> O totem está desligado. Aplique um novo serial na aba Licença.');return''}
function blockPage(){applyTheme(activeC());hdr('Licença');$('participantPage').innerHTML=`<div class="panel login"><h2>🔒 ${LIC.st==='none'?'Totem não ativado':'Licença suspensa ou vencida'}</h2><p class="muted">ID deste totem (informe ao fornecedor):</p><p><b style="font-size:20px;user-select:all">${esc(db.installId)}</b></p><div class="field"><label>Serial de licença</label><input id="serial" placeholder="MT1...."></div><div class="actions"><button class="btn primary" onclick="activate()">Ativar</button><button class="btn small outline" onclick="openLogin()">Administração</button></div></div>`;show('participantPage')}
async function activate(){const s=$('serial').value.trim(),i=await verifyLic(s);if(!i)return toast('Serial inválido.');if(i.d!==db.installId)return toast('Este serial pertence a outro totem.');db.license={serial:s};await checkLic();toast(licBlock()?'Serial vencido ou suspenso.':'Licença ativada.');if(isAdmin()&&SEC==='license')goAdmin('license');else toStart()}
function aLicense(){const i=LIC.info;return`<div class="panel"><h2>🔑 Licença</h2>${licBanner()}<div class="grid-2"><div><p class="muted">Status</p><b>${{ok:'Ativa',warn:'Vence em breve',overdue:'Vencida (carência)',blocked:'Suspensa ou expirada',none:'Não ativada'}[LIC.st]}</b></div><div><p class="muted">Cliente / totem</p><b>${esc(i?i.c+' • '+i.t:'—')}</b></div><div><p class="muted">Pago até</p><b>${i?esc(i.e):'—'}</b></div><div><p class="muted">ID deste totem</p><b style="user-select:all">${esc(db.installId)}</b></div><div><p class="muted">Jogos liberados</p><b>${esc(licGames()?(licGames().map(gl).join(', ')||'nenhum'):'Todos')}</b></div></div><div class="field" style="margin-top:14px"><label>Novo serial (renovação mensal)</label><input id="serial"></div><div class="actions"><button class="btn primary" onclick="activate()">Aplicar serial</button></div></div>`}

/* ---------- mídia (playlist ociosa ou totem indoor) ---------- */
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('mrTotemMedia',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>ok(r.result);r.onerror=no});
const idbPut=async(k,v)=>{const d=await idb();return new Promise((ok,no)=>{const t=d.transaction('f','readwrite');t.objectStore('f').put(v,k);t.oncomplete=ok;t.onerror=no})};
const idbGet=async k=>{const d=await idb();return new Promise((ok,no)=>{const r=d.transaction('f').objectStore('f').get(k);r.onsuccess=()=>ok(r.result);r.onerror=no})};
const idbDel=async k=>{const d=await idb();return new Promise((ok,no)=>{const t=d.transaction('f','readwrite');t.objectStore('f').delete(k);t.oncomplete=ok;t.onerror=no})};
let MP={on:false,tm:null,url:null,cur:null},cc=0,ct;
function playMedia(force){if(MP.on||(licBlock()&&!force))return;const n=Date.now(),L=[];db.media.items.filter(m=>m.active&&(m.url||m.fileId)&&(!m.start||n>=new Date(m.start))&&(!m.end||n<=new Date(m.end))).forEach(m=>{for(let k=0;k<Math.max(1,m.repeat);k++)L.push(m)});
if(!L.length){if(force)toast('Nenhuma mídia ativa para reproduzir.');return}MP={on:true,list:L,i:0,tm:null,url:null,cur:null};$('media').classList.remove('hidden');nextMedia()}
async function nextMedia(){if(!MP.on)return;clearTimeout(MP.tm);if(MP.url){URL.revokeObjectURL(MP.url);MP.url=null}const m=MP.list[MP.i++%MP.list.length];let src=m.url;
if(m.fileId){try{const b=await idbGet(m.fileId);if(b)src=MP.url=URL.createObjectURL(b)}catch(e){}}if(!MP.on)return;
if(!src){MP.tm=setTimeout(nextMedia,1500);return}MP.cur=m;const hint=m.game&&db.media.mode!=='media'?'<div style="position:absolute;bottom:28px;left:0;right:0;text-align:center"><span class="badge" style="font-size:18px;padding:12px 22px">Toque para jogar</span></div>':'';
$('mediaBox').innerHTML=(m.type==='video'?`<video src="${esc(src)}" autoplay muted playsinline style="width:100%;height:100%;object-fit:contain"></video>`:`<img src="${esc(src)}" alt="" style="width:100%;height:100%;object-fit:contain">`)+hint;
if(m.type==='video'){const v=$('mediaBox').firstChild;v.onended=nextMedia;v.onerror=()=>{MP.tm=setTimeout(nextMedia,1500)}}else MP.tm=setTimeout(nextMedia,Math.max(2,+m.duration||10)*1000)}
function stopMedia(){MP.on=false;clearTimeout(MP.tm);if(MP.url)URL.revokeObjectURL(MP.url);MP.url=null;$('media').classList.add('hidden');$('mediaBox').innerHTML=''}
function mediaTap(){if(isAdmin()&&$('adminPage').classList.contains('active'))return stopMedia();if(db.media.mode==='media')return;const g=MP.cur?.game;stopMedia();lastAct=Date.now();if(g&&GM[g]&&gameOn(g)){if(S.pid)startGame(g,S.pid);else S.want=g}}
function cornerTap(){cc++;clearTimeout(ct);ct=setTimeout(()=>cc=0,2500);if(cc>=5){cc=0;stopMedia();openLogin()}}
setInterval(()=>{const m=db.media;if(MP.on||m.mode==='games'||licBlock()||!(S.armed||$('participantPage').classList.contains('active')))return;if(m.mode==='media'||Date.now()-lastAct>m.idle*1000)playMedia()},1000);
function aMedia(){const m=db.media,o=(v,l)=>`<option value="${v}" ${m.mode===v?'selected':''}>${l}</option>`;return`<div class="panel"><h2>📺 Mídia</h2><div class="form-grid"><div class="field"><label>Modo do totem</label><select id="mMode">${o('games','Só jogos')}${o('both','Mídia quando ocioso + jogos')}${o('media','Só mídia (totem indoor, sem jogos)')}</select></div><div class="field"><label>Segundos ocioso até iniciar a mídia</label><input id="mIdle" type="number" min="3" value="${m.idle}"></div></div><p class="muted">No modo só mídia, toque 5 vezes no canto superior direito da tela para abrir a administração.</p>
${m.items.map((x,i)=>`<div class="card mi" data-id="${esc(x.id)}" style="margin:10px 0"><div class="form-grid"><div class="field"><label>Nome</label><input data-k="name" value="${esc(x.name)}"></div><div class="field"><label>Tipo</label><select data-k="type"><option value="video" ${x.type==='video'?'selected':''}>Vídeo</option><option value="image" ${x.type==='image'?'selected':''}>Imagem</option></select></div><div class="field"><label>Arquivo (salvo neste navegador)</label><input type="file" accept="video/*,image/*" onchange="upMedia('${esc(x.id)}',event)"><span class="muted">${x.fileId?'Enviado: '+esc(x.fileName||''):'Nenhum arquivo'}</span></div><div class="field"><label>ou link (URL)</label><input data-k="url" value="${esc(x.url)}"></div><div class="field"><label>Duração da imagem (s)</label><input data-k="duration" type="number" min="2" value="${x.duration}"></div><div class="field"><label>Repetições por ciclo</label><input data-k="repeat" type="number" min="1" value="${x.repeat}"></div><div class="field"><label>Dia de entrada</label><input data-k="start" type="datetime-local" value="${esc(x.start)}"></div><div class="field"><label>Dia de saída</label><input data-k="end" type="datetime-local" value="${esc(x.end)}"></div><div class="field"><label>Ao tocar, abrir o jogo</label><select data-k="game"><option value="">Nenhum</option>${Object.keys(GM).map(g=>`<option value="${g}" ${x.game===g?'selected':''}>${GM[g].label}</option>`).join('')}</select></div><label class="check-row"><input type="checkbox" data-k="active" ${x.active?'checked':''}> Ativa</label></div><div class="actions"><button class="btn small" onclick="moveMedia(${i},-1)">↑</button><button class="btn small" onclick="moveMedia(${i},1)">↓</button><button class="btn small danger" onclick="delMedia(${i})">Excluir</button></div></div>`).join('')||'<div class="empty">Nenhuma mídia ainda. Adicione a primeira.</div>'}
<div class="actions"><button class="btn" onclick="addMedia()">+ Adicionar mídia</button><button class="btn primary" onclick="saveMedia()">Salvar mídia</button><button class="btn outline" onclick="previewMedia()">Testar reprodução</button></div></div>`}
function readMedia(){const m=db.media;if($('mMode')){m.mode=$('mMode').value;m.idle=Math.max(3,+$('mIdle').value||20)}document.querySelectorAll('.mi').forEach(el=>{const x=m.items.find(i=>i.id===el.dataset.id);if(!x)return;const g=k=>el.querySelector(`[data-k="${k}"]`);x.name=g('name').value.trim()||'Mídia';x.type=g('type').value;x.url=g('url').value.trim();x.duration=Math.max(2,+g('duration').value||10);x.repeat=Math.max(1,+g('repeat').value||1);x.start=g('start').value;x.end=g('end').value;x.game=g('game').value;x.active=g('active').checked})}
function saveMedia(){readMedia();save();toast('Mídia salva.');goAdmin('media')}
function addMedia(){readMedia();db.media.items.push({id:uid('m'),name:'Nova mídia',type:'video',url:'',fileId:'',fileName:'',duration:10,repeat:1,start:'',end:'',game:'',active:true});save();goAdmin('media')}
function moveMedia(i,d){readMedia();const a=db.media.items,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();goAdmin('media')}
function delMedia(i){readMedia();const x=db.media.items.splice(i,1)[0];if(x?.fileId)idbDel(x.fileId).catch(()=>{});save();goAdmin('media')}
async function upMedia(id,e){const f=e.target.files?.[0];if(!f)return;readMedia();const x=db.media.items.find(i=>i.id===id);try{if(x.fileId)await idbDel(x.fileId);x.fileId=uid('f');x.fileName=f.name;x.type=f.type.startsWith('image')?'image':'video';await idbPut(x.fileId,f);save();toast('Arquivo salvo.');goAdmin('media')}catch(err){toast('Não foi possível salvar o arquivo.')}}
function previewMedia(){readMedia();save();stopMedia();playMedia(true)}
async function init(){db=norm(db);await checkLic();save();if(isAdmin())openAdmin();else renderPart()}
init();
</script>
</body>
</html>
