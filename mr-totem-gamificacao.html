<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Mr. Totem | Gamificação</title>
<style>
:root{--primary:#111827;--primary2:#374151;--bg:#f4f5f7;--card:#fff;--text:#111827;--muted:#6b7280;--border:#e5e7eb;--accent:#eef2ff;--danger:#dc2626;--success:#16a34a;--shadow:0 12px 35px rgba(0,0,0,.08)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}button:disabled{opacity:.45;cursor:not-allowed}.hidden{display:none!important}
header{position:sticky;top:0;z-index:30;background:var(--primary);color:#fff;min-height:64px;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:21px;letter-spacing:.5px}.brand img{height:44px;max-width:170px;object-fit:contain}
.header-right{display:flex;align-items:center;gap:10px}.status{font-size:12px;opacity:.9}.icon-btn{background:#ffffff18;color:#fff;border:1px solid #ffffff25;padding:8px 12px;border-radius:10px}
main{max-width:1200px;margin:auto;padding:20px}.page{display:none}.page.active{display:block}
.hero{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border-radius:22px;padding:26px;margin-bottom:18px;box-shadow:var(--shadow)}.hero h1{margin:0 0 8px;font-size:clamp(24px,5vw,40px)}.hero p{margin:0;opacity:.85}
.hero-img{margin-top:16px;border-radius:16px;overflow:hidden;background:#0000002e;display:flex;align-items:center;justify-content:center}.hero-img img{width:100%;height:100%;display:block}
.panel{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px;margin-bottom:16px}.panel h2,.panel h3{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px}.game-card{min-height:170px;display:flex;flex-direction:column;justify-content:space-between}.game-icon{font-size:42px}
.muted{color:var(--muted);font-size:13px}.stat{font-size:30px;font-weight:900}.stat-label{font-size:13px;color:var(--muted)}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}nav button{background:var(--card);color:var(--text);border:1px solid var(--border);padding:9px 12px;border-radius:10px}nav button.active{background:var(--primary);color:#fff}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:800}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:11px;background:#fff;color:#111827}.field textarea{min-height:110px}
.btn{padding:11px 15px;border-radius:10px;font-weight:800;background:#e5e7eb;color:#111827;display:inline-block}.btn.primary{background:var(--primary);color:#fff}.btn.success{background:var(--success);color:#fff}.btn.danger{background:var(--danger);color:#fff}.btn.outline{background:transparent;border:1px solid var(--border)}.btn.small{padding:7px 10px;font-size:12px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:800;background:var(--accent)}.badge.green{background:#dcfce7;color:#166534}.badge.red{background:#fee2e2;color:#991b1b}.badge.gray{background:#f3f4f6;color:#4b5563}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:640px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--border);font-size:13px}th{font-size:12px;color:var(--muted)}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.game-area{text-align:center}
.memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:640px;margin:18px auto}.memory-card{aspect-ratio:1;border-radius:14px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;overflow:hidden;border:3px solid transparent}.memory-card.revealed,.memory-card.matched{background:#fff;color:var(--text);border-color:var(--primary)}.memory-card.matched{opacity:.6}.memory-card img{width:100%;height:100%;object-fit:cover}
.quiz-option{width:100%;text-align:left;margin:7px 0;padding:15px;border:1px solid var(--border);border-radius:12px;background:#fff;color:#111827}.quiz-option:active{border-color:var(--primary)}
.timer{font-variant-numeric:tabular-nums}.timer.warning{color:var(--danger)}
.wheelbox{position:relative;width:min(330px,82vw);margin:24px auto}.wheelbox:before{content:"";position:absolute;top:-16px;left:50%;transform:translateX(-50%);border:14px solid transparent;border-top:26px solid var(--danger);border-bottom:0;z-index:3}
.wheel{width:100%;aspect-ratio:1;border-radius:50%;border:8px solid var(--primary);position:relative;overflow:hidden;transition:transform 4.2s cubic-bezier(.12,.75,.15,1);box-shadow:var(--shadow)}
.wheel i{position:absolute;left:50%;top:0;width:96px;height:50%;transform-origin:50% 100%;font-style:normal;font-size:12px;color:#fff;font-weight:800;padding-top:14px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px #000b}
.hub{position:absolute;inset:50% auto auto 50%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;background:#fff;border:4px solid var(--primary);display:flex;align-items:center;justify-content:center;font-weight:900;z-index:2}
.chests{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:22px 0}.chest{font-size:96px;line-height:1;cursor:pointer;user-select:none;transition:transform .2s}.chest:active{transform:scale(.92)}.chest.open{animation:pop .6s}
@keyframes pop{40%{transform:scale(1.35) rotate(-8deg)}}
.result{text-align:center;padding:34px 14px}.result .big{font-size:76px;animation:pop .8s}.result h1{font-size:34px;margin:8px}
.check-row{display:flex;align-items:center;gap:8px;padding:9px;border:1px solid var(--border);border-radius:10px;font-size:14px}.check-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.login{max-width:440px;margin:40px auto}.preview-img{width:100%;max-height:170px;object-fit:contain;border:1px dashed var(--border);border-radius:10px;background:#fafafa}
.upload-preview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}.upload-preview-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
.toast{position:fixed;right:16px;bottom:16px;background:#111827;color:#fff;padding:12px 16px;border-radius:12px;z-index:100;opacity:0;pointer-events:none;transform:translateY(10px);transition:.2s}.toast.show{opacity:1;transform:none}
.empty{text-align:center;padding:26px;color:var(--muted)}.mini-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.mini-stat{padding:14px;border-radius:13px;background:var(--card);border:1px solid var(--border)}
.bar{display:grid;grid-template-columns:110px 1fr 40px;gap:8px;align-items:center;margin:6px 0;font-size:13px}.bar div{background:#e5e7eb;border-radius:99px;height:12px;overflow:hidden}.bar i{display:block;height:100%;background:var(--primary);border-radius:99px}.bar i.g{background:var(--success)}.bar i.r{background:var(--danger)}
footer{text-align:center;color:var(--muted);padding:26px;font-size:12px}
@media(max-width:850px){.grid,.mini-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){main{padding:12px}.form-grid,.grid,.grid-2{grid-template-columns:1fr}.memory-grid{gap:6px}.memory-card{font-size:22px}.hero{padding:18px}.brand{font-size:17px}.bar{grid-template-columns:80px 1fr 34px}}
</style>
</head>
<body>
<header><div class="brand"><img id="logo" class="hidden" alt=""><span id="brandName">MR. TOTEM</span></div><div class="header-right"><span id="headerStatus" class="status"></span><button class="icon-btn" onclick="toggleFS()" aria-label="Tela cheia">⛶</button></div></header>
<main>
<section id="participantPage" class="page active"></section>
<section id="gamePage" class="page"></section>
<section id="adminPage" class="page"></section>
<section id="loginPage" class="page"></section>
</main>
<footer id="foot">Mr. Totem • Gamificação</footer>
<div id="toast" class="toast"></div>
<div id="media" class="hidden" onclick="mediaTap()" style="position:fixed;inset:0;background:#000;z-index:90;cursor:pointer"><div id="mediaBox" style="width:100%;height:100%"></div><div onclick="event.stopPropagation();cornerTap()" style="position:absolute;top:0;right:0;width:80px;height:80px"></div></div>
<script>
'use strict';
const KEY='mrTotem_FINAL_2026',VER=4,$=id=>document.getElementById(id);
const GM={memory:{label:'Memory',icon:'🧠',t:60},quiz:{label:'Quiz',icon:'❓',t:30},roulette:{label:'Roleta',icon:'🎡',t:15},chest:{label:'Baú',icon:'🎁',t:20}};
const TH={primary:'#111827',primary2:'#374151',background:'#f4f5f7',card:'#ffffff',text:'#111827',accent:'#eef2ff'};
const EMO=['🍎','🚀','⭐','🎯','🎈','🔥','🍀','💎','🎵','🐱','🌈','⚽','🍕','🎁','👑','🌻','🐳','🎲','🍩','🦄'];
const clone=x=>JSON.parse(JSON.stringify(x));
const uid=p=>p+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const esc=v=>String(v??'').replace(/[&<>'"`]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;','`':'&#96;'}[c]));
const isObj=v=>v&&typeof v==='object'&&!Array.isArray(v);
function merge(b,v){const o=clone(b);if(!isObj(v))return o;for(const k in v)o[k]=(isObj(v[k])&&isObj(o[k]))?merge(o[k],v[k]):v[k];return o}
const DC={id:'campanha_1',name:'Campanha Principal',active:true,startDate:'',endDate:'',fields:{name:true,whatsapp:true,email:true,cpf:false},games:Object.keys(GM),gameTimes:{memory:60,quiz:30,roulette:15,chest:20},inactivityTime:0,lossMessage:'Tempo esgotado! Você perdeu.',image:'',logo:'',brandName:'MR. TOTEM',showBrandName:true,imageFit:'cover',imageHeight:260,theme:TH,autoReturn:{enabled:false,seconds:8},fullscreenDefault:false,showCampaignImage:true,maxPlaysPerParticipant:0};
const mkPrize=(id,name,n)=>({id,name,description:'',total:n,remaining:n,delivered:0,active:true,games:[],weight:1});
const DD={version:VER,license:null,maxSeen:0,installId:'',totem:{name:'Totem 1',games:null,loop:true,loopSec:6},media:{mode:'both',idle:20,items:[]},settings:{adminPassword:'1234',defaultGameTimes:{memory:60,quiz:30,roulette:15,chest:20}},campaigns:[DC],participants:[],winners:[],history:[],
prizes:[mkPrize('p1','Desconto especial',10),mkPrize('p2','Brinde',5),mkPrize('p3','Experiência exclusiva',2)],
memory:{title:'Memory',pairs:4,images:[]},
quiz:{title:'Quiz Mr. Totem',minCorrect:1,questions:[{question:'Qual produto é o destaque da Mr. Totem?',options:['Totem digital','Bicicleta','Televisão antiga','Câmera'],correct:0}]},
roulette:{options:['Desconto','Brinde','!Tente novamente','Prêmio especial']},chest:{options:['Desconto','Brinde','Prêmio surpresa','!Boa sorte na próxima']}};
/* ---------- migração / normalização (preserva dados antigos) ---------- */
function normC(c,i){const x=merge(DC,c||{});x.id=x.id||uid('camp');x.name=x.name||'Campanha '+(i+1);x.fields=merge(DC.fields,x.fields);x.theme=merge(TH,x.theme);x.autoReturn=merge(DC.autoReturn,x.autoReturn);x.gameTimes=merge(DC.gameTimes,x.gameTimes);x.games=(Array.isArray(x.games)?x.games:Object.keys(GM)).filter(g=>GM[g]);x.inactivityTime=Math.max(0,+x.inactivityTime||0);x.maxPlaysPerParticipant=Math.max(0,+x.maxPlaysPerParticipant||0);return x}
function norm(raw){const x=merge(DD,raw||{});x.version=VER;x.settings=merge(DD.settings,x.settings);x.settings.defaultGameTimes=merge(DD.settings.defaultGameTimes,x.settings.defaultGameTimes);
x.campaigns=(Array.isArray(x.campaigns)?x.campaigns:[]).map(normC);if(!x.campaigns.length)x.campaigns=[normC(DC,0)];
let seen=false;x.campaigns.forEach(c=>{if(c.active&&!seen)seen=true;else c.active=false});if(!seen)x.campaigns[0].active=true;
['participants','winners','history','prizes'].forEach(k=>{if(!Array.isArray(x[k]))x[k]=[]});
x.prizes=x.prizes.map(p=>{const q=merge({id:uid('p'),name:'Prêmio',description:'',total:0,remaining:0,delivered:0,active:true,games:[],weight:1},p);q.remaining=Math.max(0,+q.remaining||0);q.delivered=Math.max(0,+q.delivered||0);q.total=Math.max(+q.total||0,q.remaining+q.delivered);q.weight=Math.max(1,+q.weight||1);q.games=Array.isArray(q.games)?q.games.filter(g=>GM[g]):[];return q});
x.memory.pairs=Math.min(20,Math.max(1,+x.memory.pairs||4));x.memory.images=Array.isArray(x.memory.images)?x.memory.images:[];
x.installId=x.installId||uid('T').slice(2).toUpperCase();if(!Array.isArray(x.media.items))x.media.items=[];if(x.totem.games&&!Array.isArray(x.totem.games))x.totem.games=null;if(!Array.isArray(x.quiz.questions)||!x.quiz.questions.length)x.quiz.questions=clone(DD.quiz.questions);
x.quiz.questions=x.quiz.questions.map(q=>({question:String(q.question||'Pergunta'),options:(Array.isArray(q.options)?q.options:[]).concat(['','','','']).slice(0,4).map((o,i)=>o||'Opção '+(i+1)),correct:Math.min(3,Math.max(0,+q.correct||0))}));
x.quiz.minCorrect=Math.min(x.quiz.questions.length,Math.max(1,+x.quiz.minCorrect||1));
['roulette','chest'].forEach(k=>{x[k].options=(Array.isArray(x[k].options)?x[k].options:[]).map(s=>String(s).trim()).filter(Boolean);if(k==='roulette'&&x[k].options.length<2)x[k].options=clone(DD.roulette.options);if(!x[k].options.length)x[k].options=clone(DD[k].options)});
return x}
function load(){try{let r=localStorage.getItem(KEY);if(!r){const k=Object.keys(localStorage).find(k=>/^mrTotem/i.test(k)&&k!==KEY);if(k)r=localStorage.getItem(k)}return norm(r?JSON.parse(r):null)}catch(e){return norm(null)}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){toast('Não foi possível salvar. O armazenamento pode estar cheio.');return false}}
let db=load();
/* ---------- utilidades ---------- */
function toast(m){const e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),3000)}
const activeC=()=>db.campaigns.find(c=>c.active)||db.campaigns[0],getC=id=>db.campaigns.find(c=>c.id===id)||null,getP=id=>db.participants.find(p=>p.id===id)||null,cFor=pid=>{const p=getP(pid);return(p&&getC(p.campaignId))||activeC()};
const fmt=v=>{try{return new Date(v).toLocaleString('pt-BR')}catch(e){return''}},gl=g=>GM[g]?.label||g||'';
const isLoss=s=>/^!|tente novamente|boa sorte|n[aã]o ganhou|quase/i.test(String(s)),lbl=s=>String(s).replace(/^!\s*/,'');
function running(c){const n=Date.now();if(c.startDate&&n<new Date(c.startDate))return'soon';if(c.endDate&&n>new Date(c.endDate))return'ended';return''}
function applyTheme(c){const t=merge(TH,c?.theme),r=document.documentElement.style;r.setProperty('--primary',t.primary);r.setProperty('--primary2',t.primary2);r.setProperty('--bg',t.background);r.setProperty('--card',t.card);r.setProperty('--text',t.text);r.setProperty('--accent',t.accent);const l=$('logo');if(c?.logo){l.src=c.logo;l.classList.remove('hidden')}else l.classList.add('hidden');$('brandName').textContent=c?.brandName||'MR. TOTEM';$('brandName').classList.toggle('hidden',!!(c?.logo&&c.showBrandName===false));$('foot').textContent=(c?.brandName||'Mr. Totem')+' • Gamificação'}
const heroImg=c=>c.showCampaignImage&&c.image?`<div class="hero-img" style="height:min(${Math.min(600,Math.max(120,+c.imageHeight||260))}px,45vh)"><img src="${esc(c.image)}" alt="" style="object-fit:${c.imageFit==='contain'?'contain':'cover'}"></div>`:''
const hdr=t=>$('headerStatus').textContent=t||'';
function show(id){S.armed=false;document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));$(id).classList.add('active');scrollTo(0,0)}
function toggleFS(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>toast('Tela cheia indisponível.'));else document.exitFullscreen?.()}
const limitHit=(pid,c)=>c.maxPlaysPerParticipant>0&&db.history.filter(h=>h.participantId===pid).length>=c.maxPlaysPerParticipant;
/* ---------- estado e timers (com token anti-prêmio-tardio) ---------- */
let lastAct=Date.now();
const S={pid:null,active:false,locked:false,tok:0,game:null,left:0,spin:false,want:null,armed:false},T={g:null,i:null,a:null};
const stopG=()=>{clearInterval(T.g);T.g=null;S.left=0;sync()},stopI=()=>{clearTimeout(T.i);T.i=null},stopA=()=>{clearInterval(T.a);T.a=null};
function sync(){document.querySelectorAll('[data-t]').forEach(e=>{e.textContent=S.left>0?S.left+'s':'--';e.classList.toggle('warning',S.left>0&&S.left<=5)})}
function startI(){stopI();const c=S.pid&&cFor(S.pid);if(!c||!c.inactivityTime)return;T.i=setTimeout(()=>{if(!S.pid)return;if(S.active&&!S.locked)finish('',false,'inatividade');else toStart()},c.inactivityTime*1000)}
['click','touchstart','keydown','input'].forEach(e=>document.addEventListener(e,()=>{lastAct=Date.now();if(S.pid)startI()},{capture:true,passive:true}));
function startG(){stopG();const c=cFor(S.pid),g=S.game,tok=S.tok;S.left=Math.max(1,+c.gameTimes[g]||+db.settings.defaultGameTimes[g]||GM[g].t);sync();
T.g=setInterval(()=>{if(tok!==S.tok||!S.active||S.locked){clearInterval(T.g);return}S.left--;sync();if(S.left<=0)finish('',false,'tempo')},1000)}
function autoReturn(c){stopA();const lp=db.totem.loop&&S.pid&&S.game&&!limitHit(S.pid,c);if(!$('ar')||!(lp||c?.autoReturn?.enabled))return;let n=Math.max(1,lp?db.totem.loopSec:+c.autoReturn.seconds||8);const tx=()=>{const e=$('ar');if(e)e.textContent=(lp?'Nova rodada em ':'Voltando ao início em ')+n+'s...'};tx();T.a=setInterval(()=>{n--;if(n<=0){stopA();lp?armGame():toStart()}else tx()},1000)}
/* ---------- fluxo do participante ---------- */
function toStart(){stopA();stopG();stopI();Object.assign(S,{pid:null,active:false,locked:false,game:null,spin:false,want:null});S.tok++;renderPart()}
function toGames(){stopA();stopG();S.active=false;S.locked=false;S.tok++;S.pid?openSel(S.pid):toStart()}
function renderPart(){const c=activeC();applyTheme(c);hdr(c.name);if(licBlock())return blockPage();const st=running(c);let body;
if(st)body=`<div class="panel empty"><h2>${st==='soon'?'Esta campanha ainda não começou':'Esta campanha foi encerrada'}</h2><p>${st==='soon'?'Início em '+fmt(c.startDate):'Encerrou em '+fmt(c.endDate)}</p></div>`;
else{const F=[['name','Nome','name','text'],['whatsapp','WhatsApp','tel','tel'],['email','E-mail','email','email'],['cpf','CPF','off','numeric']];
body=`<div class="panel"><h2>Cadastro</h2><div class="form-grid">${F.filter(f=>c.fields[f[0]]).map(f=>`<div class="field"><label>${f[1]}</label><input id="r_${f[0]}" autocomplete="${f[2]}" inputmode="${f[3]==='text'?'text':f[3]}" ${f[0]==='email'?'type="email"':''}></div>`).join('')}</div><div class="actions"><button class="btn primary" onclick="register()">Começar</button></div></div>`}
$('participantPage').innerHTML=`<div class="hero"><h1>${esc(c.name)}</h1><p>Cadastre-se, jogue e concorra a prêmios.</p>${heroImg(c)}</div>${body}<div class="actions"><button class="btn small outline" onclick="openLogin()">Administração</button></div>`;show('participantPage')}
function register(){const c=activeC();if(running(c))return;const v={};for(const k in c.fields)if(c.fields[k]){v[k]=($('r_'+k)?.value||'').trim();if(!v[k])return toast('Preencha todos os campos.')}
if(v.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email))return toast('E-mail inválido.');
if(v.whatsapp&&!/^\d{10,13}$/.test(v.whatsapp.replace(/\D/g,'')))return toast('WhatsApp inválido. Use DDD + número.');
if(v.cpf&&v.cpf.replace(/\D/g,'').length!==11)return toast('CPF inválido.');
const p={id:uid('participant'),name:v.name||'',whatsapp:v.whatsapp||'',email:v.email||'',cpf:v.cpf||'',campaignId:c.id,campaignName:c.name,createdAt:Date.now()};db.participants.push(p);save();S.pid=p.id;const w=S.want;S.want=null;openSel(p.id);if(w&&gameOn(w))startGame(w,p.id)}
function openSel(pid){const p=getP(pid),c=cFor(pid);if(!p||!c)return toStart();S.pid=pid;S.active=false;S.locked=false;S.tok++;stopG();stopA();applyTheme(c);startI();hdr(c.name);
const hit=limitHit(pid,c);
const cards=c.games.filter(gameOn).map(g=>`<div class="card game-card"><div><div class="game-icon">${GM[g].icon}</div><h3>${GM[g].label}</h3><p class="muted">Tempo: ${+c.gameTimes[g]||GM[g].t}s</p></div><button class="btn primary" ${hit?'disabled':''} onclick="startGame('${g}','${esc(pid)}')">${hit?'Limite atingido':'Jogar'}</button></div>`).join('');

function renderQuizAdm(){const e=$('quizEd');if(!e)return;e.innerHTML=db.quiz.questions.map((q,i)=>`<div class="card" style="margin:10px 0"><div class="field"><label>Questão ${i+1}</label><input data-q="${i}" value="${esc(q.question)}"></div><div class="grid-2" style="margin-top:8px">${q.options.map((o,j)=>`<div class="field"><label>Opção ${j+1}</label><input data-o="${i}-${j}" value="${esc(o)}"></div>`).join('')}</div><div class="field" style="margin-top:8px"><label>Resposta correta (1-4)</label><input data-c="${i}" type="number" min="1" max="4" value="${q.correct+1}"></div><button class="btn small danger" style="margin-top:8px" onclick="delQ(${i})">Remover</button></div>`).join('')}
function readQuiz(){db.quiz.questions.forEach((q,i)=>{q.question=document.querySelector(`[data-q="${i}"]`).value.trim()||'Pergunta';q.options=q.options.map((_,j)=>document.querySelector(`[data-o="${i}-${j}"]`).value.trim()||'Opção '+(j+1));q.correct=Math.min(3,Math.max(0,(+document.querySelector(`[data-c="${i}"]`).value||1)-1))})}
function addQ(){readQuiz();db.quiz.questions.push({question:'Nova pergunta',options:['Opção 1','Opção 2','Opção 3','Opção 4'],correct:0});renderQuizAdm()}
function delQ(i){if(db.quiz.questions.length<=1)return toast('Mantenha ao menos uma questão.');readQuiz();db.quiz.questions.splice(i,1);renderQuizAdm()}
function saveQuiz(){readQuiz();db.quiz.title=$('quizTitle').value.trim()||'Quiz Mr. Totem';db.quiz.minCorrect=Math.min(db.quiz.questions.length,Math.max(1,+$('quizMin').value||1));save();toast('Quiz salvo.');goAdmin('games')}
function saveList(k,id){const o=$(id).value.split(/\n/).map(x=>x.trim()).filter(Boolean);if(k==='roulette'&&o.length<2)return toast('A roleta precisa de ao menos 2 setores.');if(!o.length)return toast('Informe ao menos uma opção.');db[k].options=o;save();toast('Salvo.');goAdmin('games')}

<div class="section-title" style="margin-top:8px"><span class="muted">Total: ${p.total} • Entregues: ${p.delivered}</span><button class="btn small danger" onclick="delPrize('${esc(p.id)}')">Excluir</button></div></div>`).join('')||'<div class="empty">Nenhum prêmio.</div>'}<div class="actions"><button class="btn primary" onclick="savePrizes()">Salvar prêmios</button></div></div>`}

function aReports(){const H=db.history,W=H.filter(h=>h.type==='win').length,L=H.filter(h=>h.type==='loss').length,by={};Object.keys(GM).forEach(g=>by[g]={w:0,l:0});H.forEach(h=>{if(by[h.game])by[h.game][h.type==='win'?'w':'l']++});

function aSettings(){return`<div class="panel"><h2>🔐 Senha do administrador</h2><div class="form-grid"><div class="field"><label>Senha atual</label><input id="oldPass" type="password"></div><div class="field"></div><div class="field"><label>Nova senha</label><input id="newPass" type="password"></div><div class="field"><label>Confirmar nova senha</label><input id="newPass2" type="password"></div></div><div class="actions"><button class="btn primary" onclick="changePass()">Alterar senha</button></div></div>
<div class="panel"><h2>⏱ Tempos padrão (segundos)</h2><div class="grid">${Object.keys(GM).map(g=>`<div class="field"><label>${GM[g].label}</label><input id="dt_${g}" type="number" min="1" value="${+db.settings.defaultGameTimes[g]||GM[g].t}"></div>`).join('')}</div><button class="btn primary" style="margin-top:12px" onclick="saveTimes()">Salvar tempos</button></div>
<div class="panel"><h2>💾 Backup e restauração</h2><p class="muted">Inclui campanhas, participantes, jogos, prêmios, histórico e configurações. Os dados ficam neste navegador: faça backup com frequência.</p><div class="actions"><button class="btn primary" onclick="backup()">Exportar backup JSON</button><label class="btn">Importar backup<input type="file" accept="application/json,.json" hidden onchange="restore(event)"></label></div></div>

function changePass(){const a=$('oldPass').value,b=$('newPass').value,c=$('newPass2').value;if(a!==db.settings.adminPassword)return toast('Senha atual incorreta.');if(b.length<4)return toast('A nova senha precisa ter ao menos 4 caracteres.');if(b!==c)return toast('As senhas não coincidem.');db.settings.adminPassword=b;save();toast('Senha alterada.');goAdmin('settings')}

function restore(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result),d=j.data||j;if(!isObj(d)||!Array.isArray(d.campaigns))throw 0;if(!confirm('Restaurar este backup? Os dados atuais serão substituídos.'))return;d.installId=db.installId;d.license=db.license;d.maxSeen=db.maxSeen;db=norm(d);save();toast('Backup restaurado.');setTimeout(openAdmin,300)}catch(x){toast('Backup inválido ou corrompido.')}};r.readAsText(f)}
function clearData(){if(!confirm('Apagar participantes, vencedores e histórico? Esta ação não pode ser desfeita. Faça um backup antes.'))return;db.participants=[];db.winners=[];db.history=[];save();toast('Dados apagados.');goAdmin('settings')}
/* ---------- licença: assinatura ECDSA (a chave privada fica só no gerador) ---------- */
const PUB={"kty":"EC","crv":"P-256","x":"fUvfXkvRxCwJzmxR9RS2Dj5xoLrgIoTGPhoOCzfZX84","y":"M8MTPYRg3AYzsw5mwL1ePye_6L6JIN_KeP9SUrRyzRk"};
const unb=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
async function verifyLic(s){try{const[p,pl,sg]=String(s).trim().split('.');if(p!=='MT1')return null;const k=await crypto.subtle.importKey('jwk',PUB,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);return await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},k,unb(sg),unb(pl))?JSON.parse(new TextDecoder().decode(unb(pl))):null}catch(e){return null}}
let LIC={st:'none',days:0,gr:5,info:null};
const licBlock=()=>LIC.st==='none'||LIC.st==='blocked';
async function checkLic(){db.maxSeen=Math.max(db.maxSeen||0,Date.now());const i=db.license&&await verifyLic(db.license.serial);
if(!i||i.d!==db.installId){LIC={st:'none',days:0,gr:5,info:null};return}
if(i.u){try{const r=await fetch(i.u+(i.u.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'});const j=await r.json();db.license.revoked=(j.revoked||[]).includes(i.i)}catch(e){}}
const days=Math.floor((new Date(i.e+'T23:59:59')-db.maxSeen)/864e5),gr=i.g??5;
LIC={info:i,days,gr,st:db.license.revoked?'blocked':days>=0?(days<=7?'warn':'ok'):days>=-gr?'overdue':'blocked'};save()}
function licBanner(){const{st,days,gr}=LIC,b=(c,t)=>`<div class="panel" style="border-color:${c};background:${c==='#f59e0b'?'#fffbeb':'#fef2f2'}">${t}</div>`;
if(st==='warn')return b('#f59e0b',`<b>⚠️ Sua licença vence ${days<1?'hoje':'em '+days+' dia(s)'}.</b> Renove a mensalidade para evitar o desligamento.`);
if(st==='overdue')return b('#dc2626',`<b>⛔ Mensalidade vencida.</b> O software será desligado em ${Math.max(1,gr+days+1)} dia(s) se o pagamento não for regularizado.`);
if(st==='blocked')return b('#dc2626','<b>⛔ Licença suspensa ou expirada.</b> O totem está desligado. Aplique um novo serial na aba Licença.');return''}
function blockPage(){applyTheme(activeC());hdr('Licença');$('participantPage').innerHTML=`<div class="panel login"><h2>🔒 ${LIC.st==='none'?'Totem não ativado':'Licença suspensa ou vencida'}</h2><p class="muted">ID deste totem (informe ao fornecedor):</p><p><b style="font-size:20px;user-select:all">${esc(db.installId)}</b></p><div class="field"><label>Serial de licença</label><input id="serial" placeholder="MT1...."></div><div class="actions"><button class="btn primary" onclick="activate()">Ativar</button><button class="btn small outline" onclick="openLogin()">Administração</button></div></div>`;show('participantPage')}
async function activate(){const s=$('serial').value.trim(),i=await verifyLic(s);if(!i)return toast('Serial inválido.');if(i.d!==db.installId)return toast('Este serial pertence a outro totem.');db.license={serial:s};await checkLic();toast(licBlock()?'Serial vencido ou suspenso.':'Licença ativada.');if(isAdmin()&&SEC==='license')goAdmin('license');else toStart()}
function aLicense(){const i=LIC.info;return`<div class="panel"><h2>🔑 Licença</h2>${licBanner()}<div class="grid-2"><div><p class="muted">Status</p><b>${{ok:'Ativa',warn:'Vence em breve',overdue:'Vencida (carência)',blocked:'Suspensa ou expirada',none:'Não ativada'}[LIC.st]}</b></div><div><p class="muted">Cliente / totem</p><b>${esc(i?i.c+' • '+i.t:'—')}</b></div><div><p class="muted">Pago até</p><b>${i?esc(i.e):'—'}</b></div><div><p class="muted">ID deste totem</p><b style="user-select:all">${esc(db.installId)}</b></div><div><p class="muted">Jogos liberados</p><b>${esc(licGames()?(licGames().map(gl).join(', ')||'nenhum'):'Todos')}</b></div></div><div class="field" style="margin-top:14px"><label>Novo serial (renovação mensal)</label><input id="serial"></div><div class="actions"><button class="btn primary" onclick="activate()">Aplicar serial</button></div></div>`}
setInterval(async()=>{await checkLic();if(licBlock()&&!['adminPage','loginPage'].some(id=>$(id).classList.contains('active'))){stopMedia();S.active=false;S.tok++;renderPart()}},3600000);
/* ---------- este totem: jogos visíveis e rodada automática ---------- */
const licGames=()=>LIC.info&&Array.isArray(LIC.info.j)?LIC.info.j:null,lk=g=>!!licGames()&&!licGames().includes(g);
const gameOn=g=>(!db.totem.games||db.totem.games.includes(g))&&!lk(g);
function aTotem(){const t=db.totem;return`<div class="panel"><h2>🖥 Este totem</h2><div class="field"><label>Nome do totem</label><input id="tName" value="${esc(t.name)}"></div><h3>Jogos exibidos no menu inicial</h3><div class="check-list">${Object.keys(GM).map(g=>`<label class="check-row"><input type="checkbox" id="tg_${g}" ${gameOn(g)?'checked':''} ${lk(g)?'disabled':''}> ${GM[g].icon} ${GM[g].label}${lk(g)?' 🔒 não incluído na licença':''}</label>`).join('')}</div><p class="muted">Aqui você vê todos os jogos; só os marcados aparecem para o jogador (e ainda dependem dos jogos da campanha).</p><h3>Rodada automática</h3><div class="grid-2"><div class="field"><label>Depois de cada resultado</label><select id="tLoop"><option value="1" ${t.loop?'selected':''}>Abrir "Toque para jogar" no mesmo jogo</option><option value="0" ${t.loop?'':'selected'}>Não repetir automaticamente</option></select></div><div class="field"><label>Segundos até a nova tela</label><input id="tLoopSec" type="number" min="1" value="${t.loopSec}"></div></div><div class="actions"><button class="btn primary" onclick="saveTotem()">Salvar</button></div></div>`}
function saveTotem(){const t=db.totem,a=Object.keys(GM).filter(g=>$('tg_'+g).checked);if(!a.length)return toast('Marque ao menos um jogo.');t.name=$('tName').value.trim()||'Totem';t.games=a.length===Object.keys(GM).filter(g=>!lk(g)).length?null:a;t.loop=$('tLoop').value==='1';t.loopSec=Math.max(1,+$('tLoopSec').value||6);save();toast('Totem salvo.')}

/* ---------- mídia (playlist ociosa ou totem indoor) ---------- */
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('mrTotemMedia',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>ok(r.result);r.onerror=no});
const idbPut=async(k,v)=>{const d=await idb();return new Promise((ok,no)=>{const t=d.transaction('f','readwrite');t.objectStore('f').put(v,k);t.oncomplete=ok;t.onerror=no})};
const idbGet=async k=>{const d=await idb();return new Promise((ok,no)=>{const r=d.transaction('f').objectStore('f').get(k);r.onsuccess=()=>ok(r.result);r.onerror=no})};
const idbDel=async k=>{const d=await idb();return new Promise((ok,no)=>{const t=d.transaction('f','readwrite');t.objectStore('f').delete(k);t.oncomplete=ok;t.onerror=no})};
let MP={on:false,tm:null,url:null,cur:null},cc=0,ct;
function playMedia(force){if(MP.on||(licBlock()&&!force))return;const n=Date.now(),L=[];db.media.items.filter(m=>m.active&&(m.url||m.fileId)&&(!m.start||n>=new Date(m.start))&&(!m.end||n<=new Date(m.end))).forEach(m=>{for(let k=0;k<Math.max(1,m.repeat);k++)L.push(m)});
if(!L.length){if(force)toast('Nenhuma mídia ativa para reproduzir.');return}MP={on:true,list:L,i:0,tm:null,url:null,cur:null};$('media').classList.remove('hidden');nextMedia()}
async function nextMedia(){if(!MP.on)return;clearTimeout(MP.tm);if(MP.url){URL.revokeObjectURL(MP.url);MP.url=null}const m=MP.list[MP.i++%MP.list.length];let src=m.url;
if(m.fileId){try{const b=await idbGet(m.fileId);if(b)src=MP.url=URL.createObjectURL(b)}catch(e){}}if(!MP.on)return;
if(!src){MP.tm=setTimeout(nextMedia,1500);return}MP.cur=m;const hint=m.game&&db.media.mode!=='media'?'<div style="position:absolute;bottom:28px;left:0;right:0;text-align:center"><span class="badge" style="font-size:18px;padding:12px 22px">Toque para jogar</span></div>':'';
$('mediaBox').innerHTML=(m.type==='video'?`<video src="${esc(src)}" autoplay muted playsinline style="width:100%;height:100%;object-fit:contain"></video>`:`<img src="${esc(src)}" alt="" style="width:100%;height:100%;object-fit:contain">`)+hint;
if(m.type==='video'){const v=$('mediaBox').firstChild;v.onended=nextMedia;v.onerror=()=>{MP.tm=setTimeout(nextMedia,1500)}}else MP.tm=setTimeout(nextMedia,Math.max(2,+m.duration||10)*1000)}
function stopMedia(){MP.on=false;clearTimeout(MP.tm);if(MP.url)URL.revokeObjectURL(MP.url);MP.url=null;$('media').classList.add('hidden');$('mediaBox').innerHTML=''}
function mediaTap(){if(isAdmin()&&$('adminPage').classList.contains('active'))return stopMedia();if(db.media.mode==='media')return;const g=MP.cur?.game;stopMedia();lastAct=Date.now();if(g&&GM[g]&&gameOn(g)){if(S.pid)startGame(g,S.pid);else S.want=g}}
function cornerTap(){cc++;clearTimeout(ct);ct=setTimeout(()=>cc=0,2500);if(cc>=5){cc=0;stopMedia();openLogin()}}
setInterval(()=>{const m=db.media;if(MP.on||m.mode==='games'||licBlock()||!(S.armed||$('participantPage').classList.contains('active')))return;if(m.mode==='media'||Date.now()-lastAct>m.idle*1000)playMedia()},1000);
function aMedia(){const m=db.media,o=(v,l)=>`<option value="${v}" ${m.mode===v?'selected':''}>${l}</option>`;return`<div class="panel"><h2>📺 Mídia</h2><div class="form-grid"><div class="field"><label>Modo do totem</label><select id="mMode">${o('games','Só jogos')}${o('both','Mídia quando ocioso + jogos')}${o('media','Só mídia (totem indoor, sem jogos)')}</select></div><div class="field"><label>Segundos ocioso até iniciar a mídia</label><input id="mIdle" type="number" min="3" value="${m.idle}"></div></div><p class="muted">No modo só mídia, toque 5 vezes no canto superior direito da tela para abrir a administração.</p>
${m.items.map((x,i)=>`<div class="card mi" data-id="${esc(x.id)}" style="margin:10px 0"><div class="form-grid"><div class="field"><label>Nome</label><input data-k="name" value="${esc(x.name)}"></div><div class="field"><label>Tipo</label><select data-k="type"><option value="video" ${x.type==='video'?'selected':''}>Vídeo</option><option value="image" ${x.type==='image'?'selected':''}>Imagem</option></select></div><div class="field"><label>Arquivo (salvo neste navegador)</label><input type="file" accept="video/*,image/*" onchange="upMedia('${esc(x.id)}',event)"><span class="muted">${x.fileId?'Enviado: '+esc(x.fileName||''):'Nenhum arquivo'}</span></div><div class="field"><label>ou link (URL)</label><input data-k="url" value="${esc(x.url)}"></div><div class="field"><label>Duração da imagem (s)</label><input data-k="duration" type="number" min="2" value="${x.duration}"></div><div class="field"><label>Repetições por ciclo</label><input data-k="repeat" type="number" min="1" value="${x.repeat}"></div><div class="field"><label>Dia de entrada</label><input data-k="start" type="datetime-local" value="${esc(x.start)}"></div><div class="field"><label>Dia de saída</label><input data-k="end" type="datetime-local" value="${esc(x.end)}"></div><div class="field"><label>Ao tocar, abrir o jogo</label><select data-k="game"><option value="">Nenhum</option>${Object.keys(GM).map(g=>`<option value="${g}" ${x.game===g?'selected':''}>${GM[g].label}</option>`).join('')}</select></div><label class="check-row"><input type="checkbox" data-k="active" ${x.active?'checked':''}> Ativa</label></div><div class="actions"><button class="btn small" onclick="moveMedia(${i},-1)">↑</button><button class="btn small" onclick="moveMedia(${i},1)">↓</button><button class="btn small danger" onclick="delMedia(${i})">Excluir</button></div></div>`).join('')||'<div class="empty">Nenhuma mídia ainda. Adicione a primeira.</div>'}
<div class="actions"><button class="btn" onclick="addMedia()">+ Adicionar mídia</button><button class="btn primary" onclick="saveMedia()">Salvar mídia</button><button class="btn outline" onclick="previewMedia()">Testar reprodução</button></div></div>`}
function readMedia(){const m=db.media;if($('mMode')){m.mode=$('mMode').value;m.idle=Math.max(3,+$('mIdle').value||20)}document.querySelectorAll('.mi').forEach(el=>{const x=m.items.find(i=>i.id===el.dataset.id);if(!x)return;const g=k=>el.querySelector(`[data-k="${k}"]`);x.name=g('name').value.trim()||'Mídia';x.type=g('type').value;x.url=g('url').value.trim();x.duration=Math.max(2,+g('duration').value||10);x.repeat=Math.max(1,+g('repeat').value||1);x.start=g('start').value;x.end=g('end').value;x.game=g('game').value;x.active=g('active').checked})}
function saveMedia(){readMedia();save();toast('Mídia salva.');goAdmin('media')}
function addMedia(){readMedia();db.media.items.push({id:uid('m'),name:'Nova mídia',type:'video',url:'',fileId:'',fileName:'',duration:10,repeat:1,start:'',end:'',game:'',active:true});save();goAdmin('media')}
function moveMedia(i,d){readMedia();const a=db.media.items,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();goAdmin('media')}
function delMedia(i){readMedia();const x=db.media.items.splice(i,1)[0];if(x?.fileId)idbDel(x.fileId).catch(()=>{});save();goAdmin('media')}
async function upMedia(id,e){const f=e.target.files?.[0];if(!f)return;readMedia();const x=db.media.items.find(i=>i.id===id);try{if(x.fileId)await idbDel(x.fileId);x.fileId=uid('f');x.fileName=f.name;x.type=f.type.startsWith('image')?'image':'video';await idbPut(x.fileId,f);save();toast('Arquivo salvo.');goAdmin('media')}catch(err){toast('Não foi possível salvar o arquivo.')}}
function previewMedia(){readMedia();save();stopMedia();playMedia(true)}
async function init(){db=norm(db);await checkLic();save();if(isAdmin())openAdmin();else renderPart()}
init();
</script>
</body>
</html>
